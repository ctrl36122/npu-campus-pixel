; ---------------------------------------------------------------
; macOS：通用二进制（arm64 + x86_64），导出成 .zip（内含 .app）。
; codesign/codesign=0 表示不签名 —— 在 Windows/Linux 上导出只能这样，
; 生成的 app 没有签名，macOS 端第一次打开前要 ad-hoc 签一次：
;   xattr -cr 像素工大.app && codesign --force --deep --sign - 像素工大.app
; 在 Mac 上导出时可以把 codesign 改成 2 并填 identity，才不会被 Gatekeeper 拦。
; 注意：.dmg 只能在 macOS 上做，Windows 上请导出 .zip。
; ---------------------------------------------------------------

